# Preview deploy of apps/web for every pull request into main, so the stakeholder can check each story in
# isolation (CLAUDE.md "One story = one session = one branch = one PR"; ADR-005).
# The preview reads from the staging Supabase project with the anon key. Migrations in the PR are NOT on
# staging until the PR is merged, so a story with schema changes is verified on staging after merge or
# locally; the PR body says which.
# Skips cleanly (green, with the missing names in the summary) until the host and project exist, and for
# pull requests from forks (no secrets).
name: Preview

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write # sticky comment with the preview URL

env:
  WRANGLER_VERSION: 4.156.2
  PAGES_PROJECT_WEB: benben-web-staging

jobs:
  preflight:
    name: Preflight (host and staging project configured?)
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      frontend: ${{ steps.check.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        env:
          STAGING_PROJECT_REF: ${{ secrets.STAGING_PROJECT_REF || vars.STAGING_PROJECT_REF }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          STAGING_SUPABASE_ANON_KEY: ${{ vars.STAGING_SUPABASE_ANON_KEY }}
        run: bash tools/ci/deploy-preflight.sh preview

  web:
    name: Preview apps/web
    needs: preflight
    if: ${{ needs.preflight.outputs.frontend == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT_REF: ${{ secrets.STAGING_PROJECT_REF || vars.STAGING_PROJECT_REF }}
      BRANCH: ${{ github.head_ref }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Build (staging backend, anon key only)
        env:
          VITE_SUPABASE_ANON_KEY: ${{ vars.STAGING_SUPABASE_ANON_KEY }}
          VITE_APP_ENV: staging
        run: VITE_SUPABASE_URL="https://${PROJECT_REF}.supabase.co" pnpm --filter @benben/web build
      - name: "8 · Bundle secret scan"
        run: bash tools/ci/check-bundle-secrets.sh apps/web/dist
      - name: Deploy preview to Cloudflare Pages
        id: deploy
        run: |
          wrangler() { pnpm dlx "wrangler@${WRANGLER_VERSION}" "$@"; }
          wrangler pages project list | grep -q -w "$PAGES_PROJECT_WEB" \
            || wrangler pages project create "$PAGES_PROJECT_WEB" --production-branch main
          wrangler pages deploy apps/web/dist --project-name "$PAGES_PROJECT_WEB" --branch "$BRANCH" \
            --commit-hash "${{ github.event.pull_request.head.sha }}" --commit-dirty=true | tee deploy.log
          # Prefer the stable per-branch alias; fall back to the per-deployment URL.
          url="$(grep -o -E 'https://[a-z0-9-]+\.'"$PAGES_PROJECT_WEB"'\.pages\.dev' deploy.log | tail -1)"
          [ -n "$url" ] || { echo "::error::could not read the preview URL from wrangler output"; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### Preview: $url" >> "$GITHUB_STEP_SUMMARY"
      - name: Comment the preview URL on the PR
        uses: actions/github-script@v7
        env:
          URL: ${{ steps.deploy.outputs.url }}
        with:
          script: |
            const marker = '<!-- benben-preview -->';
            const body = `${marker}\n**Preview (apps/web):** ${process.env.URL}\n\nCommit ${context.payload.pull_request.head.sha.slice(0, 7)}. Backend: staging Supabase (anon key). Schema changes in this PR reach staging only after merge.`;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const mine = comments.find((c) => c.body && c.body.startsWith(marker));
            if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });
