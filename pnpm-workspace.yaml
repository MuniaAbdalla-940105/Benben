packages:
  - apps/*
  - packages/*

# pnpm 10 blocks dependency install scripts by default. Allow only the ones we need:
# the Supabase CLI downloads its pinned binary; esbuild installs its platform binary.
onlyBuiltDependencies:
  - supabase
  - esbuild

# wrangler (pinned for Pages uploads) pulls in workerd, whose install script is only needed for local
# `wrangler dev`, which we do not use.
ignoredBuiltDependencies:
  - workerd
